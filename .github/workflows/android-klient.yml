name: Runiczny Duch Klient APK

on:
  workflow_dispatch:
  push:
    branches: [klient-apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate the Android project
        run: npx --no-install expo prebuild --platform android --no-install
      - name: Build the standalone test APK
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" dist/Runiczny_Duch_Klient_Fiolet_TEST.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Runiczny_Duch_Klient_Fiolet_TEST
          path: dist/Runiczny_Duch_Klient_Fiolet_TEST.apk
          if-no-files-found: error
